name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Webapp JS syntax
        run: node --check webapp/app.js

      - name: JSON assets valid
        run: |
          python3 -c "import json; json.load(open('webapp/manifest.webmanifest')); json.load(open('eval/clips_manifest.json')); print('JSON OK')"
