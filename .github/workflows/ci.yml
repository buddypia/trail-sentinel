name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Single gate: FORMAL (compile/syntax/AST contracts/no-secrets)
      # + EMPIRICAL (unit suite, runtime probe, timing budgets).
      # Both layers always run; see tools/verify_all.py.
      - name: Verify (formal + empirical)
        run: python3 tools/verify_all.py
